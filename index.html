<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stick Hoops</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cg fill=%22none%22 stroke=%22%23121211%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M10 40 Q32 31 54 40%22 stroke-width=%223.4%22/%3E%3Ccircle cx=%2232%22 cy=%2227%22 r=%2212%22 stroke-width=%224.4%22 fill=%22%23fbfbf8%22/%3E%3Cpath d=%22M20.5 27 H43.5 M32 15 V39%22 stroke-width=%222.4%22/%3E%3Cpath d=%22M12 43 L19 58 M32 46 L32 60 M52 43 L45 58 M19 58 Q32 62.5 45 58%22 stroke-width=%222.8%22/%3E%3Cpath d=%22M10 40 Q32 51 54 40%22 stroke-width=%225.2%22/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="claude:viewport-fit-sides" content="cover" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" /><feDisplacementMap in="SourceGraphic" scale="1.2" /></filter>
    </svg>
    <div class="app">
      <header>
        <h1 id="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">Stick Hoops</span></h1>
        <div class="hdr-r">
          <button id="btn-menu" class="chip" data-icon="menu" hidden>Menu</button>
          <button id="btn-sound" class="chip" aria-pressed="true">Sound on</button>
        </div>
      </header>
      <div id="levels" class="levels" hidden></div>
      <div class="hud" id="hud" hidden><div id="hud-l"></div><div id="hud-m"></div><div id="hud-r"></div></div>
      <div class="tut" id="tutorial" role="region" aria-label="Tutorial" hidden></div>
      <div class="court">
        <canvas id="court" tabindex="0" aria-label="Basketball court. Press, pull back and release to shoot, or use the arrow keys and space."></canvas>
        <div class="overlay" id="overlay" hidden>
          <div class="card"><h2 id="ov-title"></h2><p id="ov-body"></p><div class="btns" id="ov-btns"></div></div>
        </div>
        <div class="screen" id="menu" hidden></div>
      </div>
      <p class="help" id="help">Press anywhere on the court, pull back away from the hoop and let go. A longer pull shoots harder. Keys: ←→ angle, ↑↓ power, space to shoot.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
